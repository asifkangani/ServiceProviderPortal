server.port = 9090
#Database Configurations
spring.datasource.url=jdbc:mysql://localhost:3306/service-provider-onboarding-portal
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none

spring.datasource.hikari.connectionTimeout=40000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1200000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

#Application Configurations
# PDF upload size limit (in KB)
file.pdf.max-size-kb=256
reset.password.url=http://localhost:9090/reset-password
reset.password.expiry.minutes=15
enable.postpaid = false
software.upload.path =C:/ServiceProviderDocuments/
portal.url = http://localhost:9090
portal.name = Service Provider Onboarding Hub




#Spring
server.servlet.context-path=/
server.forward-headers-strategy=framework
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=2KB




