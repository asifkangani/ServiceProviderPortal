<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${portalName}">Service Provider Portal</title>
   
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>

<body>
    <div id="global-loader" class="loader-overlay hidden">
        <div class="loader-card">
            <div class="spinner"></div>
            <p>Loading, please wait...</p>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="auth-card">
            <div class="logo-section">
                <div class="logo-circle">
                    <img th:src="@{/icons/building.svg}" alt="Building Icon">
                </div>
                <h1 class="main-title" th:text="'Welcome to ' + ${portalName}">
                    Welcome to Service Provider Onboarding Hub
                </h1>
                <p class="subtitle">Sign in to continue</p>
            </div>

            <form method="post" onsubmit="showLoader()" th:action="@{/}">

                <div class="input-field-group">
                    <label class="field-label">Email</label>
                    <div class="input-control-wrapper">
                        <span class="icon-prefix">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
                                fill="none">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" name="email" class="form-input" placeholder="you@example.com" required />
                    </div>
                </div>

                <div class="input-field-group">
                    <label class="field-label">Password</label>
                    <div class="input-control-wrapper">
                        <span class="icon-prefix">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
                                fill="none">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••"
                            required />
                    </div>
                </div>

                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}" />
                    

                <button type="submit" class="btn-signin">Sign in</button>
            </form>

            <div class="auth-footer">
                <a th:href="@{/forget-password}" class="link-secondary">Forgot password?</a>
            </div>
        </div>
    </div>

    <input type="hidden" id="url" th:value="${url}">
    <input type="hidden" id="portalUrl" th:value="${portalUrl}" />
    <script th:src="@{/js/sweetalert.js}"></script>
    <script th:src="@{/js/loader.js}"></script>
    <script th:src="@{/js/login.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var hasError = [[${ param.error != null }]];
        const pwdChanged = [[${ param.passwordChanged != null }]];

        if (pwdChanged) {
            Swal.fire({
                icon: 'success',
                title: 'Password Updated',
                text: 'Please login again with your new password',
                confirmButtonColor: '#0ea5b7'
            });
        }

        if (hasError) {
            Swal.fire({
                icon: "error",
                title: "Login Failed",
                text: "Invalid email or password",
                confirmButtonColor: "#00acc1"
            }).then(() => {

                window.location.href = /*[[@{/}]]*/ portalUrl + "/";
            });
        }

        var unauthorized = [[${ param.unauthorized != null }]];
        var sessionExpired = [[${ param.sessionExpired != null }]];
        var portalUrl = document.getElementById("portalUrl").value;

        if (sessionExpired) {
            Swal.fire({
                icon: "warning",
                title: "Session Expired",
                text: "Your session has expired. Please sign in again.",
                confirmButtonColor: "#00acc1",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = portalUrl + "/";
            });
        }

        else if (unauthorized) {
            Swal.fire({
                icon: "warning",
                title: "Unauthorized",
                text: "Please sign in to continue",
                confirmButtonColor: "#00acc1",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = portalUrl + "/";
            });
        }

        /*]]>*/

    </script>
</body>

</html>
