<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/new-forget-password.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
    <!-- Global Loader -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="loader-card">
            <div class="spinner"></div>
            <p>Loading, please wait...</p>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="auth-card">
            
            <!-- Top Back Link -->
            <div class="back-nav">
                <a th:href="@{/}" onclick="showLoader()" class="back-link">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to sign in
                </a>
            </div>

            <!-- Header Section -->
            <div class="auth-header">
                <h1 class="main-title">Reset your password</h1>
                <p class="subtitle">Enter your email and we'll send you a link to reset your password</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgotForm">
                <div class="input-field-group">
                    <label class="field-label">Email</label>
                    <div class="input-control-wrapper">
                        <span class="icon-prefix">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required />
                    </div>
                    <div class="error-msg" id="emailError" style="display:none; color:#ef4444; font-size:13px; margin-top: 5px; text-align: left;">
                        Please enter a valid email address
                    </div>
                </div>

                <button type="submit" class="btn-signin">Send reset link</button>
            </form>

        </div>
    </div>

    <input type="hidden" id="portalUrl" th:value="${portalUrl}" />
    <script th:src="@{/js/sweetalert.js}"></script>
    <script th:src="@{/js/loader.js}"></script>
    <script th:src="@{/js/forget-password.js}"></script>
</body>
</html>
