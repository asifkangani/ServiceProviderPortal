<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${portalName}">Service Provider Portal</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/signin.css}">

</head>

<body>
    <div id="global-loader" class="loader-overlay hidden">
        <div class="loader-card">
            <div class="spinner"></div>
            <p>Loading, please wait...</p>
        </div>
    </div>
    <input type="hidden" id="url" th:value="${url}">

    <div class="page-container">


        <div class="header-section">

            <div class="heading">
                <div class="logo-container">

                    <!--                    <div class="section-icon">-->
                    <!--                        <i class="ph ph-building"></i>-->
                    <!--                    </div>-->

                    <div class="section-icon">
                        <img th:src="@{/icons/building.svg}" alt="Building" class="section-icon-img">
                    </div>

                </div>
                <h1 th:text="${portalName}">Service Provider Portal</h1>

            </div>

            <p class="header-subtitle" style="padding-left: 15px;padding-top: 13px;">Access your Organization Account
            </p>
        </div>


        <div class="card">


            <div class="card-content">

                <p class="card-description">Enter your credentials to continue</p>

                <form method="post" onsubmit="showLoader()" th:action="@{/}">

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-input" placeholder="your.email@example.com"
                            required />
                    </div>
                    <!-- <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-input" placeholder="Enter password"
                            required />
                        <a onclick="showLoader()" th:href="@{/forgot-password}" class="forgot-link">
                            Forgot Password?
                        </a>
                    </div>  -->
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" id="password" class="form-input"
                                placeholder="Enter password" required />

                            <!--                            <i class="ph ph-eye ph-bold toggle-password"></i>-->

                            <img th:src="@{/icons/eye.svg}" alt="eye" class="toggle-password" style="width: 20px;
    height: 20px;">

                        </div>
                        <a onclick="showLoader()" th:href="@{/forgot-password}" class="forgot-link">
                            Forgot Password?
                        </a>
                    </div>

                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}" />

                    <button type="submit" class="btn-submit">Sign In</button>
                </form>





            </div>


        </div>


        <div class="page-footer">
            <img th:src="@{/img/footer_logo.png}" alt="Portal Logo" class="footer-logo-img">
        </div>

    </div>
    <input type="hidden" id="portalUrl" th:value="${portalUrl}" />

    <script th:src="@{/js/sweetalert.js}"></script>
    <script th:src="@{/js/loader.js}"></script>
    <script th:src="@{/js/signin.js}"></script>


    <script th:inline="javascript">
        /*<![CDATA[*/
        var hasError = [[${ param.error != null }]];
        const pwdChanged = [[${ param.passwordChanged != null }]];

        if (pwdChanged) {
            Swal.fire({
                icon: 'success',
                title: 'Password Updated',
                text: 'Please login again with your new password',
                confirmButtonColor: '#0ea5b7'
            });
        }

        if (hasError) {
            Swal.fire({
                icon: "error",
                title: "Login Failed",
                text: "Invalid email or password",
                confirmButtonColor: "#00acc1"
            }).then(() => {

                window.location.href = /*[[@{/}]]*/ portalUrl + "/";
            });
        }

        var unauthorized = [[${ param.unauthorized != null }]];
        var sessionExpired = [[${ param.sessionExpired != null }]];
        var portalUrl = document.getElementById("portalUrl").value;

        if (sessionExpired) {
            Swal.fire({
                icon: "warning",
                title: "Session Expired",
                text: "Your session has expired. Please sign in again.",
                confirmButtonColor: "#00acc1",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = portalUrl + "/";
            });
        }

        else if (unauthorized) {
            Swal.fire({
                icon: "warning",
                title: "Unauthorized",
                text: "Please sign in to continue",
                confirmButtonColor: "#00acc1",
                confirmButtonText: "OK",
                allowOutsideClick: false
            }).then(() => {
                window.location.href = portalUrl + "/";
            });
        }

        /*]]>*/

    </script>




</body>

</html>
